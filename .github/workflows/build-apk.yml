name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        uses: ArtemMendel/Buildozer-Action@v1
        with:
          command: buildozer android debug
          buildozer_version: stable
